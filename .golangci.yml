version: "2"

linters:
  settings:
    # cmd/staticcheck's own set: all of it, but not the quickfix analysers,
    # which it treats as debug output and golangci-lint turns on.
    staticcheck:
      checks:
        - all
        - -QF*

  exclusions:
    # Errors with nowhere to go: Fprintf to a ResponseWriter, a deferred Close.
    presets:
      - std-error-handling
