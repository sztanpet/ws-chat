# golangci-lint's own config, and the whole of `make lint`: govet,
# staticcheck, unused, errcheck and ineffassign all run from here, one
# binary and one pass over the tree.

version: "2"

linters:
  settings:
    # golangci-lint redistributes honnef.co/go/tools but does not
    # reproduce how honnef's own command configures it, and the
    # difference is not a preference: `cmd/staticcheck` does not
    # REGISTER the quickfix analysers at all unless you pass
    # -debug.run-quickfix-analyzers. They are debug output there, and
    # here they are five reports, none of them a bug and none worth
    # taking -- unembedding `ta.app.autojoin` into `ta.autojoin` hides
    # which object is being addressed, and De Morgan on
    # `!(alpha < middle && middle < zebra)` reads worse than "not
    # sorted". golangci-lint turns them on by default; turn them back
    # off, and inherit honnef's `["all"]` for everything else rather
    # than golangci-lint's shorter list, which also drops the ST checks.
    staticcheck:
      checks:
        - all
        - -QF*

  exclusions:
    # What golangci-lint v1 excluded by default and v2 made opt-in:
    # unchecked Fprintf to a ResponseWriter, deferred Close, and the
    # rest of the errors that have nowhere to go. Without it errcheck
    # reports eight of them here, none actionable.
    presets:
      - std-error-handling
