# Every step is a make target, so its flags live in one place. `make vendor`
# is left out: CI checks the tree it was given rather than rewriting it.

when:
  - event: [push, pull_request, manual, cron]

variables:
  # Not alpine: -race needs cgo and a C toolchain.
  - &golang 'golang:1.27'
  # Every Go cache on the agent's persistent /cache, or each run rebuilds it all.
  - &goenv
    GOCACHE: /cache/go-build
    GOPATH: /cache/gopath
    GOLANGCI_LINT_CACHE: /cache/golangci-lint

steps:
  - name: test
    image: *golang
    environment: *goenv
    commands:
      - make test-race

  - name: lint
    image: *golang
    environment: *goenv
    commands:
      - export PATH="/cache/gopath/bin:$PATH"
      # Every run: a linter merely present on /cache can predate the toolchain.
      - make tools
      - make lint

  # go test compiles every package; this is for what only the production
  # build does.
  - name: build
    image: *golang
    environment: *goenv
    commands:
      - make build
      - make loadgen

  # Off pushes, as it needs the network; it runs only if the repository has a cron.
  - name: vulncheck
    image: *golang
    environment: *goenv
    when:
      - event: cron
    commands:
      - export PATH="/cache/gopath/bin:$PATH"
      - make tools
      - make vulncheck
